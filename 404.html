<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page not found — RozgarJobs</title>
<meta name="theme-color" content="#0f2a47">
<style>
  :root { --navy:#0f2a47; --gold:#c9a227; --ink:#0e1518; --muted:#5f7078; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:#f5f7f8; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    text-align:center;
  }
  .box { max-width:460px; }
  .mark {
    width:56px; height:56px; margin:0 auto 18px; border-radius:15px;
    background:var(--navy); color:#fff; display:grid; place-items:center;
    font-weight:800; font-size:26px; letter-spacing:-1px;
  }
  .code { font-size:64px; font-weight:800; letter-spacing:-3px; color:var(--navy); line-height:1; margin:0 0 6px; }
  h1 { font-size:19px; margin:0 0 8px; letter-spacing:-.3px; }
  p { color:var(--muted); margin:0 0 22px; font-size:14.5px; line-height:1.6; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  a.btn {
    display:inline-flex; align-items:center; justify-content:center; min-height:48px;
    padding:12px 22px; border-radius:11px; text-decoration:none; font-weight:700; font-size:14.5px;
  }
  a.primary { background:var(--navy); color:#fff; }
  a.ghost { background:#fff; color:var(--navy); border:1px solid #d8dfe3; }
  a.gold { color:var(--gold); text-decoration:underline; font-size:13.5px; }
  .hint { margin-top:22px; font-size:12.5px; color:var(--muted); }
  .nearby { margin-top:26px; text-align:left; }
  .nearby h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 10px; text-align:center; }
  .nearby a {
    display:block; background:#fff; border:1px solid #e2e8ea; border-radius:11px;
    padding:12px 14px; margin-bottom:8px; text-decoration:none; color:var(--ink);
  }
  .nearby a:hover { border-color:var(--navy); }
  .nearby strong { display:block; font-size:14px; line-height:1.3; }
  .nearby span { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">R</div>
    <p class="code">404</p>
    <h1>This page is not here</h1>
    <p>
      The job may have expired, or the link has a typo. Every job on RozgarJobs has its own page —
      if the vacancy closed, the page is removed with it.
    </p>
    <div class="row">
      <a class="btn primary" id="home" href="./index.html">Browse all jobs</a>
      <a class="btn ghost" id="alerts" href="./alerts.html">Job alerts</a>
    </div>
    <div class="nearby" id="nearby" hidden>
      <h2>Similar jobs still open</h2>
      <div id="nearbyList"></div>
    </div>
    <p class="hint">
      Or <a class="gold" id="search" href="./index.html">search by city, category or keyword</a>.
    </p>
  </div>
<script>
  /* This file is served for any unknown path, so build the links from the site root. */
  (function () {
    var isGhPages = /\.github\.io$/.test(location.hostname);
    var base = isGhPages ? "/rozgar/" : "/";
    document.getElementById("home").href = base + "index.html";
    document.getElementById("alerts").href = base + "alerts.html";
    document.getElementById("search").href = base + "index.html";

    /* If an old job link 404s, the vacancy has probably closed.
       Read the slug, pull the live feed and suggest close matches. */
    var parts = location.pathname.split("/jobs/");
    if (parts.length < 2) return;
    var file = parts[1].replace(/\.html$/i, "");
    var m = [file, file.replace(/-[a-z0-9]{6}$/i, "")];

    document.getElementById("ttl").textContent = "This job has closed";
    document.getElementById("msg").textContent =
      "The vacancy you followed is no longer on RozgarJobs — either the closing date passed " +
      "or the employer withdrew it. Here are similar jobs that are still open.";

    var words = m[1].split("-").filter(function (w) { return w.length > 2; })
      .filter(function (w) { return ["jobs", "job", "2026", "2025", "apply", "last", "date", "the"].indexOf(w) < 0; });

    fetch(base + "data/jobs.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.jobs) return;
        var today = new Date().toISOString().slice(0, 10);
        var scored = data.jobs
          .filter(function (j) { return !(j.is_pk && j.last_date && j.last_date < today); })
          .map(function (j) {
            var hay = (j.title + " " + j.company + " " + (j.category || "")).toLowerCase();
            var score = 0;
            words.forEach(function (w) { if (hay.indexOf(w) > -1) score += 2; });
            if (j.is_pk) score += 1;
            return { j: j, s: score };
          })
          .filter(function (x) { return x.s > 2; })
          .sort(function (a, b) { return b.s - a.s || (b.j.published || 0) - (a.j.published || 0); })
          .slice(0, 5);

        if (!scored.length) return;
        document.getElementById("nearbyList").innerHTML = scored.map(function (x) {
          var j = x.j;
          var t = (j.display_title || j.title || "").replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
          var co = (j.company || "").replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
          var loc = (j.location || "").replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
          return '<a href="' + base + 'jobs/' + encodeURIComponent(j.slug) + '.html">' +
                 "<strong>" + t + "</strong><span>" + co + " · " + loc + "</span></a>";
        }).join("");
        document.getElementById("nearby").hidden = false;
      })
      .catch(function () {});
  })();
</script>
</body>
</html>
