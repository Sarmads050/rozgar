<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page not found — RozgarJobs</title>
<meta name="theme-color" content="#0f2a47">
<style>
  :root { --navy:#0f2a47; --gold:#c9a227; --ink:#0e1518; --muted:#5f7078; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:#f5f7f8; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    text-align:center;
  }
  .box { max-width:460px; }
  .mark {
    width:56px; height:56px; margin:0 auto 18px; border-radius:15px;
    background:var(--navy); color:#fff; display:grid; place-items:center;
    font-weight:800; font-size:26px; letter-spacing:-1px;
  }
  .code { font-size:64px; font-weight:800; letter-spacing:-3px; color:var(--navy); line-height:1; margin:0 0 6px; }
  h1 { font-size:19px; margin:0 0 8px; letter-spacing:-.3px; }
  p { color:var(--muted); margin:0 0 22px; font-size:14.5px; line-height:1.6; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  a.btn {
    display:inline-flex; align-items:center; justify-content:center; min-height:48px;
    padding:12px 22px; border-radius:11px; text-decoration:none; font-weight:700; font-size:14.5px;
  }
  a.primary { background:var(--navy); color:#fff; }
  a.ghost { background:#fff; color:var(--navy); border:1px solid #d8dfe3; }
  a.gold { color:var(--gold); text-decoration:underline; font-size:13.5px; }
  .hint { margin-top:22px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">R</div>
    <p class="code">404</p>
    <h1>This page is not here</h1>
    <p>
      The job may have expired, or the link has a typo. Every job on RozgarJobs has its own page —
      if the vacancy closed, the page is removed with it.
    </p>
    <div class="row">
      <a class="btn primary" id="home" href="./index.html">Browse all jobs</a>
      <a class="btn ghost" id="alerts" href="./alerts.html">Job alerts</a>
    </div>
    <p class="hint">
      Or <a class="gold" id="search" href="./index.html">search by city, category or keyword</a>.
    </p>
  </div>
<script>
  /* This file is served for any unknown path, so build the links from the site root. */
  (function () {
    var isGhPages = /\.github\.io$/.test(location.hostname);
    var base = isGhPages ? "/rozgar/" : "/";
    document.getElementById("home").href = base + "index.html";
    document.getElementById("alerts").href = base + "alerts.html";
    document.getElementById("search").href = base + "index.html";
  })();
</script>
</body>
</html>
